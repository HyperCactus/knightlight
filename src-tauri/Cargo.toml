[package]
name = "knightlight-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HyperCactus/knightlight"
description = "Knightlight offline chess coach"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chess-study = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
open = "5"
tokio = { version = "1", features = ["net", "time"] }
serde_json = "1"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


[dev-dependencies]
tauri = { version = "2", features = ["test"] }
