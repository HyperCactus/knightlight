[package]
name = "chess-study"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HyperCactus/knightlight"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.29"
tower-http = { version = "0.6", features = ["fs"] }
rand = "0.9"
pgn-reader = "0.28"
chrono = "0.4"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
